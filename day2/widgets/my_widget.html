<!doctype html>
<!-- ==========================================================================
     Widget skeleton — a standalone page embedded in a slide via <iframe>.
     Rules: no CDN, no web fonts, no fetch. Everything inline or vendored.
     Target box: ~1080 x 566 CSS px (that is what an iframe gets after the
     kicker + title on a 1280x720 slide). Screenshot-test at that size.

     Before you write it, answer: WHAT IS THE MOVING PICTURE, AND WHAT DOES
     THE LEARNER GRAB TO CHANGE IT?  If the answer is "a table of numbers
     updates", push harder or write a paragraph instead.
     ========================================================================== -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="_shared.css">
<style>
  body { padding:6px 8px; }
  .w { padding:12px 14px; }
  .lead { font-size:13.5px; color:#42606A; margin:0 0 11px; line-height:1.4; }
  .lead b { color:#00567C; }

  /* stage: the picture. Prefer <canvas> for anything spatial/animated. */
  .stage { width:100%; height:300px; display:block; border:1px solid #E0E7E8;
           border-radius:10px; background:#fff; }

  /* role colours — keep them consistent across the whole course so that
     colour itself carries meaning (e.g. sender=teal, receiver=petrol,
     adversary/failure=red). Declare the roles in references/brand.md. */
  .role-a { color:#1F8F89; } .role-b { color:#00567C; } .role-x { color:#D64545; }
</style>
</head><body>
<div class="w">
  <p class="lead">One line: what the learner is looking at and what to drag.
    <b>Not</b> the explanation of the mechanism — they should discover that.</p>

  <canvas class="stage" id="stage"></canvas>

  <div class="ctl">
    <label class="mono" style="font-size:12px">parameter
      <input type="range" id="p" min="0" max="100" value="40"></label>
    <button class="primary" id="play">▶ Play</button>
    <button id="reset">Reset</button>
  </div>

  <div class="cap" id="cap">Live caption — states the consequence of the current
    setting in one sentence, and updates as the learner drives it.</div>
</div>

<script>
(function () {
  var cv = document.getElementById("stage"), ctx = cv.getContext("2d");
  var W = 900, H = 300, raf = null, t = 0;

  /* crisp on HiDPI: size the backing store by devicePixelRatio */
  function fit() {
    var cssW = cv.clientWidth || W, dpr = window.devicePixelRatio || 1;
    cv.width = cssW * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    W = cssW; draw();
  }
  window.addEventListener("resize", fit);

  function state() { return { p: +document.getElementById("p").value }; }

  function update(dt) { t += dt; /* advance the simulation */ }

  function draw() {
    var s = state();
    ctx.clearRect(0, 0, W, H);
    /* …draw the real thing here: pixels, geometry, particles, a diagram that
       moves. Compute the real mechanism at toy scale — never fake the math. */
    ctx.fillStyle = "#00567C";
    ctx.fillRect(20, H / 2 - 20, s.p * 4, 40);
    document.getElementById("cap").innerHTML =
      "At <b>" + s.p + "</b>, the outcome is <em>…</em>.";
  }

  function loop() { update(1 / 60); draw(); raf = requestAnimationFrame(loop); }

  document.getElementById("p").addEventListener("input", draw);
  document.getElementById("play").addEventListener("click", function () {
    if (raf) { cancelAnimationFrame(raf); raf = null; this.textContent = "▶ Play"; }
    else { this.textContent = "⏸ Pause"; loop(); }
  });
  document.getElementById("reset").addEventListener("click", function () {
    t = 0; draw();
  });

  fit();
})();
</script>
</body></html>
